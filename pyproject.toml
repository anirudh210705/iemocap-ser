[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iemocap-ser"
version = "0.1.0"
description = "Speaker-independent speech emotion recognition on IEMOCAP"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.scripts]
prepare-iemocap = "ser.prepare_iemocap:main"
train-ser = "ser.train:main"
evaluate-ser = "ser.evaluate:main"
infer-ser = "ser.infer:main"
inspect-ser-llm = "ser.inspect_llm:main"
run-ser-experiments = "ser.run_experiments:main"
run-ser-folds = "ser.run_folds:main"
smoke-test-ser = "ser.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
